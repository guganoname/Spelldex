<style>
/* Layout: one fixed stage. The 3D device fills it, two DOM screens ride on its glass. */
:root {
  --table: #0f0b0a;          /* dark wood table under the device */
  --table-glow: #2a1c14;
  --ink: #e8c983;            /* warm gold ink on obsidian */
  --ink-soft: #b9a073;
  --ink-dim: #7d6b4e;
  --parchment: #e9dcc0;
  --line: rgba(232, 201, 131, 0.22);
  --identity: #d2492a;       /* color identity of the current card, tints the screens */
  --gem-W: #f4e9c8; --gem-U: #3f7fd0; --gem-B: #6b4a8e; --gem-R: #d2492a; --gem-G: #3f9a55; --gem-M: #e0b04a;
  --chip-bg: rgba(20, 14, 10, 0.72);
  --glass-veil: rgba(13, 11, 16, 0.6);
  --font-engrave: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-lore: "Crimson Pro", Georgia, serif;
  --font-ui: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 80% at 50% 38%, var(--table-glow), var(--table) 70%);
  background-color: var(--table);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#screens { position: absolute; inset: 0; pointer-events: none; }
.screen {
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  overflow: hidden; opacity: 0;
  border-radius: var(--r, 10px);
  color: var(--ink);
  background:
    radial-gradient(130% 90% at 50% 0%, color-mix(in srgb, var(--identity) 18%, transparent), transparent 70%),
    linear-gradient(180deg, rgba(255, 240, 210, 0.05), transparent 30%),
    var(--glass-veil);
  box-shadow: inset 0 0 0 1px rgba(232, 201, 131, 0.08), inset 0 0 24px rgba(0, 0, 0, 0.55);
  font-size: calc(var(--u, 40px) * 0.3);
}
.screen.live { pointer-events: auto; }

/* lens (top screen) */
#lens { display: grid; place-items: center; }
.reticle { position: absolute; inset: 9%; }
.reticle i { position: absolute; width: 16%; aspect-ratio: 1; border: 2px solid var(--ink); opacity: 0.75; }
.reticle i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 6px; }
.reticle i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 6px; }
.reticle i:nth-child(3) { right: 0; bottom: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 6px; }
.reticle i:nth-child(4) { left: 0; bottom: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 6px; }
.lens-hint { position: absolute; bottom: 5%; left: 0; right: 0; text-align: center; font-family: var(--font-engrave); letter-spacing: 0.12em; font-size: 0.82em; color: var(--ink-soft); }
.scanline { position: absolute; left: 9%; right: 9%; height: 2px; top: 10%; background: linear-gradient(90deg, transparent, var(--gem-U), transparent); box-shadow: 0 0 12px var(--gem-U); opacity: 0; }
#lens.scanning .scanline { opacity: 1; animation: sweep 0.7s ease-in-out infinite alternate; }
@keyframes sweep { to { top: 89%; } }
.card {
  position: relative; height: 84%; aspect-ratio: 63 / 88; border-radius: 4.5% / 3.2%;
  background: #17110d; padding: 3.2%; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.6);
  display: flex; flex-direction: column; gap: 2.4%;
  opacity: 0; transform: scale(0.92); filter: blur(6px) brightness(2);
  transition: opacity 0.4s, transform 0.4s cubic-bezier(.2,.9,.3,1.2), filter 0.5s;
}
#lens.found .card { opacity: 1; transform: none; filter: none; }
#lens.found .reticle, #lens.found .lens-hint { opacity: 0; }
.card-name { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(#e9c9a2, #c99b6c); color: #1c120c; border-radius: 3px; padding: 2% 4%; font-family: var(--font-engrave); font-weight: 700; font-size: 0.78em; }
.pips { display: flex; gap: 3px; }
.pips b { width: 0.85em; height: 0.85em; border-radius: 50%; background: var(--c); box-shadow: inset 0 -1px 0 rgba(0,0,0,0.35); }
.card-art {
  flex: 1; border-radius: 2px;
  background:
    radial-gradient(40% 30% at 62% 38%, rgba(255, 210, 120, 0.9), transparent 70%),
    radial-gradient(60% 50% at 30% 80%, rgba(170, 40, 20, 0.9), transparent 70%),
    linear-gradient(160deg, #3a1a10, #a8381c 55%, #f0a040);
  position: relative; overflow: hidden;
}
.card-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.35) 50%, transparent 65%); transform: translateX(-100%); }
#lens.found .card-art::after { animation: shimmer 1.1s 0.15s ease-out; }
@keyframes shimmer { to { transform: translateX(100%); } }
.card-type { background: linear-gradient(#e9c9a2, #c99b6c); color: #1c120c; border-radius: 3px; padding: 1.5% 4%; font-size: 0.6em; font-weight: 600; }
.card-text { background: #efe3c9; color: #1c120c; border-radius: 2px; padding: 4%; font-size: 0.56em; line-height: 1.35; height: 24%; font-family: var(--font-lore); }
.card-sample { position: absolute; top: 14%; right: 7%; font-size: 0.55em; padding: 2px 6px; border-radius: 99px; background: var(--chip-bg); color: var(--ink); letter-spacing: 0.08em; text-transform: uppercase; }

/* info (bottom screen) */
#info { display: flex; flex-direction: column; }
.entry-head { display: flex; align-items: baseline; gap: 0.6em; padding: 0.7em 0.9em 0.45em; border-bottom: 1px solid var(--line); }
.entry-no { font-family: var(--font-engrave); color: var(--ink-dim); font-size: 0.8em; letter-spacing: 0.1em; font-variant-numeric: tabular-nums; }
.entry-name { font-family: var(--font-engrave); font-weight: 700; font-size: 1.22em; letter-spacing: 0.03em; color: var(--ink); text-wrap: balance; }
.tabs { display: flex; padding: 0 0.5em; border-bottom: 1px solid var(--line); }
.tabs button {
  flex: 1; min-width: 0; appearance: none; border: 0; background: none; color: var(--ink-dim);
  font: 600 0.68em/1 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; padding: 0.75em 0 0.65em;
  border-bottom: 2px solid transparent; cursor: pointer;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--c); }
.tabs button:focus-visible { outline: 1px solid var(--ink); outline-offset: -3px; }
.panel { flex: 1; overflow: auto; padding: 0.8em 0.95em 1em; line-height: 1.45; scrollbar-width: none; }
.panel::-webkit-scrollbar { display: none; }
.panel h3 { margin: 0 0 0.35em; font: 600 0.66em/1.2 var(--font-ui); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-dim); }
.panel p { margin: 0 0 0.7em; color: var(--ink); }
.lore { font-family: var(--font-lore); font-size: 1.12em; color: var(--parchment); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 0.25em 0.9em; margin: 0 0 0.8em; font-variant-numeric: tabular-nums; }
.facts dt { color: var(--ink-dim); }
.facts dd { margin: 0; }
.meter { height: 0.5em; border-radius: 99px; background: rgba(232, 201, 131, 0.12); overflow: hidden; margin: 0.2em 0 0.9em; }
.meter i { display: block; height: 100%; width: var(--v); background: linear-gradient(90deg, var(--ink-dim), var(--ink)); }
.sample { display: inline-block; font-size: 0.72em; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-soft); margin-bottom: 0.6em; }
.toast { position: absolute; left: 50%; bottom: 0.8em; transform: translateX(-50%); background: var(--chip-bg); border: 1px solid var(--line); padding: 0.4em 0.8em; border-radius: 99px; font-size: 0.8em; opacity: 0; transition: opacity 0.25s; white-space: nowrap; }
.toast.on { opacity: 1; }

/* page chrome */
.hint {
  position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; font-family: var(--font-engrave); letter-spacing: 0.16em; font-size: 13px; color: var(--ink-soft);
  transition: opacity 0.4s; pointer-events: none;
}
.chrome { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; }
.chrome button {
  appearance: none; border: 1px solid var(--line); background: var(--chip-bg); color: var(--ink);
  font: 500 12px/1 var(--font-ui); letter-spacing: 0.04em; padding: 8px 12px; border-radius: 99px; cursor: pointer;
}
.chrome button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; color: var(--ink-soft); }
@media (prefers-reduced-motion: reduce) {
  .card, .scanline { transition: none; animation: none; }
}
</style>

<div id="stage">

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createCodex, quadToMatrix3d, lidEvents } from '../src/codex.js';

const PANELS = [
  `<span class="sample">Beispieldaten</span>
   <dl class="facts"><dt>Typ</dt><dd>Kreatur — Drache</dd><dt>Stärke</dt><dd>5/5</dd><dt>Farbe</dt><dd>Rot</dd><dt>Seltenheit</dt><dd>Selten</dd></dl>
   <h3>Stärke-Score</h3><div class="meter" style="--v:72%"><i></i></div>
   <p>Ein Klassiker seit dem ersten Set. Heute eher Sammlerstück als Turnierkarte, in Casual- und Drachen-Decks gern gespielt.</p>`,
  `<span class="sample">Beispieldaten</span>
   <h3>Preis</h3><p>Tagespreis in EUR kommt live von Scryfall, Kauf-Link führt zu Cardmarket.</p>
   <h3>90 Tage</h3><p>Verlauf aus MTGJSON-Preisen.</p>`,
  `<span class="sample">Beispieldaten</span>
   <h3>Passt in</h3><p>Drachen-Tribal, Mono-Rot, Feuerodem-Decks.</p>
   <h3>Kombos</h3><p>Aus Commander Spellbook, sobald der Daten-Build steht.</p>`,
  `<h3>Ebene · Dominaria</h3>
   <p class="lore">Shivan-Drachen nisten im Shiv-Gebirge, einer Vulkanregion auf Dominaria. Sie gelten als die gefürchtetsten Drachen ihrer Welt und sind an Lava und Asche angepasst.</p>
   <p class="lore">Größe und Gewicht nennt keine kanonische Quelle, deshalb zeigt der Codex hier keine Zahlen.</p>`,
  `<span class="sample">Beispieldaten</span>
   <dl class="facts"><dt>1993</dt><dd>Limited Edition Alpha</dd><dt>2009</dt><dd>Magic 2010</dd></dl>
   <p>Weitere Drucke folgen aus dem Katalog.</p>`,
];

const stage = document.getElementById('stage');
const lensEl = document.getElementById('lens'), infoEl = document.getElementById('info');
const panel = document.getElementById('panel'), toast = document.getElementById('toast');
const hint = document.getElementById('hint'), toggle = document.getElementById('toggle');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// --- tiny placeholder foley (the design thread owns the real sound sprite)
let ac = null;
function audio() { try { ac ??= new AudioContext(); if (ac.state === 'suspended') ac.resume(); } catch { ac = null; } return ac; }
function click(freq = 2400, dur = 0.03, gain = 0.25, q = 6) {
  const a = ac; if (!a) return;
  const n = Math.ceil(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
  const s = a.createBufferSource(); s.buffer = buf; s.playbackRate.value = 0.97 + Math.random() * 0.06;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.value = gain;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
function tone(freq, dur = 0.5, gain = 0.08, type = 'sine', delay = 0) {
  const a = ac; if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + delay;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
const buzz = (p) => { try { navigator.vibrate?.(p); } catch {} };
const GEM_TONES = [1318, 1175, 988, 880, 1047];
function feedback(ev, i = 0) {
  switch (ev) {
    case 'latch-release': click(3200, 0.025, 0.35); click(1400, 0.05, 0.15, 3); buzz(8); break;
    case 'lid-detent': click(1800, 0.03, 0.2); break;
    case 'lid-settle': click(420, 0.09, 0.4, 2); tone(110, 0.6, 0.035, 'triangle'); buzz([12, 30, 8]); break;
    case 'lid-close': click(300, 0.12, 0.45, 1.5); buzz(15); break;
    case 'press': click(2200, 0.022, 0.22); buzz(10); break;
    case 'gem': click(2600, 0.02, 0.15); tone(GEM_TONES[i], 0.5, 0.05); tone(GEM_TONES[i] * 2, 0.35, 0.015); buzz(10); break;
    case 'scan-hit': [523, 659, 784, 1047].forEach((f, k) => tone(f, 1.0, 0.04, 'sine', k * 0.03)); tone(65, 0.5, 0.08, 'sine'); buzz([15, 40, 25]); break;
  }
}

async function boot() {
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) {
    document.body.insertAdjacentHTML('beforeend', '<div class="fallback">Dieses Gerät kann kein WebGL. Der Codex braucht WebGL für die 3D-Hülle.</div>');
    return;
  }
  try { await Promise.race([document.fonts.load('600 104px "Cinzel"'), new Promise((r) => setTimeout(r, 1500))]); } catch {}

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance', preserveDrawingBuffer: !!window.__capture });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.AgXToneMapping;
  renderer.toneMappingExposure = 0.92;
  stage.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.7;
  const key = new THREE.DirectionalLight('#ffe7c2', 2.2);
  key.position.set(-6, 12, 14); // top left, as in the design system
  scene.add(key);
  const fill = new THREE.DirectionalLight('#9fb4ff', 0.25);
  fill.position.set(8, -4, 6);
  scene.add(fill);

  const codex = createCodex();
  scene.add(codex.group);
  const camera = new THREE.PerspectiveCamera(26, 1, 0.5, 200);
  window.__codex = codex; window.__scene = scene; window.__THREE = THREE; window.__renderer = renderer; window.__camera = camera;

  // spring.lid from the design tokens
  const SPRING = { mass: 2.2, stiffness: 170, damping: 22 };
  let x = 0, v = 0, target = 0, dragging = null, settled = true, dirty = true;
  let tab = 0, found = false;

  const sizes = { top: null, bottom: null };
  function measure() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    const keep = codex.t;
    codex.setOpen(1); codex.frameCamera(camera);
    const r = codex.getScreenRects(camera, { width: w, height: h });
    for (const [k, el] of [['top', lensEl], ['bottom', infoEl]]) {
      const q = r[k];
      sizes[k] = { w: Math.round(q.rect.width), h: Math.round(q.rect.height) };
      el.style.width = sizes[k].w + 'px';
      el.style.height = sizes[k].h + 'px';
      el.style.setProperty('--u', q.pxPerUnit + 'px');
      el.style.setProperty('--r', q.pxPerUnit * 0.24 + 'px');
    }
    codex.setOpen(keep);
    dirty = true;
  }
  addEventListener('resize', measure);
  measure();

  function placeScreens() {
    const r = codex.getScreenRects(camera, { width: innerWidth, height: innerHeight });
    const vis = reduceMotion ? (x > 0.5 ? 1 : 0) : Math.min(1, Math.max(0, (x - 0.82) / 0.16));
    for (const [k, el] of [['top', lensEl], ['bottom', infoEl]]) {
      const q = r[k], s = sizes[k];
      el.style.transform = q.axisAligned
        ? `translate(${Math.round(q.rect.left)}px, ${Math.round(q.rect.top)}px)`
        : quadToMatrix3d(s.w, s.h, q.corners);
      el.style.opacity = q.facing ? vis : 0;
      el.classList.toggle('live', vis > 0.95);
    }
    hint.style.opacity = x < 0.05 ? 1 : 0;
  }

  function setTarget(t) {
    if (t === target && settled) return;
    if (t === 1 && x < 0.01) feedback('latch-release');
    target = t; settled = false;
    toggle.textContent = t ? 'Schließen' : 'Öffnen';
    toggle.hidden = !!t;
    if (reduceMotion) { x = t; v = 0; }
  }

  function stepSpring(dt) {
    const n = 4, h = dt / n;
    for (let i = 0; i < n; i++) {
      const a = (-SPRING.stiffness * (x - target) - SPRING.damping * v) / SPRING.mass;
      v += a * h; x += v * h;
      if (x < 0) { x = 0; v = -v * 0.15; }
    }
    if (Math.abs(v) < 0.004 && Math.abs(x - target) < 0.002) {
      x = target; v = 0; settled = true;
      feedback(target === 1 ? 'lid-settle' : 'lid-close');
    }
  }

  let last = performance.now(), prevX = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!dragging && !settled) stepSpring(dt);
    for (const ev of lidEvents(prevX, x)) if (ev !== 'latch-release') feedback(ev);
    const lidMoved = x !== prevX; prevX = x;
    codex.setOpen(x);
    const moving = codex.update(dt);
    if (lidMoved || moving || dirty) {
      codex.frameCamera(camera);
      renderer.render(scene, camera);
      placeScreens();
      dirty = false;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // --- input on the 3D device
  const canvas = renderer.domElement;
  function ndcOf(e) { return { x: e.clientX / innerWidth * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }; }
  function startDrag(e, from) {
    audio();
    dragging = { id: e.pointerId, y0: e.clientY, x0: x, moved: false, from, lastY: e.clientY, lastT: performance.now(), vel: 0 };
  }
  function moveDrag(e) {
    if (!dragging || e.pointerId !== dragging.id) return;
    const dy = e.clientY - dragging.y0;
    if (!dragging.moved && Math.abs(dy) < 8) return;
    dragging.moved = true;
    const span = innerHeight * 0.45;
    const nt = dragging.x0 - dy / span;
    x = Math.max(0, Math.min(1.06, nt));
    const now = performance.now(), dtt = Math.max(1, now - dragging.lastT);
    dragging.vel = -(e.clientY - dragging.lastY) / span / (dtt / 1000);
    dragging.lastY = e.clientY; dragging.lastT = now;
    settled = false;
  }
  function endDrag(e) {
    if (!dragging || e.pointerId !== dragging.id) return;
    const d = dragging; dragging = null;
    if (!d.moved) { tap(e, d.from); return; }
    v = Math.max(-6, Math.min(6, d.vel));
    // 40 % detent: past it, the lid snaps open; a flick decides either way.
    const t = Math.abs(v) > 1.2 ? (v > 0 ? 1 : 0) : (x > 0.4 ? 1 : 0);
    if (t === 1 && d.x0 < 0.01) feedback('latch-release');
    target = t; settled = false;
    toggle.textContent = t ? 'Schließen' : 'Öffnen';
    toggle.hidden = !!t;
  }
  function tap(e, from) {
    if (from !== 'canvas') return;
    if (x < 0.5) { setTarget(1); return; }
    const name = codex.pickButton(ndcOf(e), camera) ?? codex.pickPart(ndcOf(e), camera);
    if (name) onButton(name);
  }
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    // Closed: drag anywhere lifts the lid. Open: drags start on the lens or the hinge zone.
    const hingeY = (() => { const p = new THREE.Vector3(0, 0, 0).project(camera); return (1 - p.y) / 2 * innerHeight; })();
    if (x < 0.5 || Math.abs(e.clientY - hingeY) < 40 || e.clientY < hingeY) startDrag(e, 'canvas');
    else { dragging = { id: e.pointerId, y0: e.clientY, x0: x, moved: false, from: 'canvas', lastY: e.clientY, lastT: performance.now(), vel: 0, noDrag: true }; }
  });
  canvas.addEventListener('pointermove', (e) => { if (dragging && !dragging.noDrag) moveDrag(e); });
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  lensEl.addEventListener('pointerdown', (e) => { lensEl.setPointerCapture(e.pointerId); startDrag(e, 'lens'); });
  lensEl.addEventListener('pointermove', moveDrag);
  lensEl.addEventListener('pointerup', endDrag);
  lensEl.addEventListener('pointercancel', endDrag);

  toggle.addEventListener('click', () => { audio(); setTarget(target ? 0 : 1); });

  // --- device logic for the demo
  function showTab(i) {
    tab = i;
    codex.setActiveTab(i);
    document.querySelectorAll('.tabs button').forEach((b, k) => b.setAttribute('aria-selected', String(k === i)));
    panel.innerHTML = PANELS[i];
    panel.scrollTop = 0;
    dirty = true;
  }
  document.querySelectorAll('.tabs button').forEach((b, i) => b.addEventListener('click', () => {
    audio(); codex.pressButton(`gem-${i}`); feedback('gem', i); showTab(i);
  }));
  let toastTimer = 0;
  function say(msg) { toast.textContent = msg; toast.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('on'), 1600); }
  function onButton(name) {
    if (name === 'hinge') { setTarget(0); return; }
    codex.pressButton(name);
    if (name.startsWith('gem-')) { const i = Number(name.slice(4)); feedback('gem', i); showTab(i); return; }
    feedback('press');
    if (name === 'scan') {
      if (lensEl.classList.contains('scanning')) return;
      lensEl.classList.remove('found');
      lensEl.classList.add('scanning');
      codex.setScanning(true);
      setTimeout(() => {
        lensEl.classList.remove('scanning'); lensEl.classList.add('found');
        codex.setScanning(false); feedback('scan-hit'); found = true;
      }, 1400);
    } else if (name === 'back') {
      lensEl.classList.remove('found'); found = false;
    } else if (name === 'search') {
      say('Suche kommt mit dem Katalog');
    } else if (name === 'dpad-left') showTab((tab + 4) % 5);
    else if (name === 'dpad-right') showTab((tab + 1) % 5);
    else if (name === 'dpad-up') panel.scrollBy({ top: -60, behavior: 'smooth' });
    else if (name === 'dpad-down') panel.scrollBy({ top: 60, behavior: 'smooth' });
  }
  showTab(0);
  addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { if (document.activeElement === document.body) { audio(); setTarget(target ? 0 : 1); } }
    if (x > 0.9 && e.key === 'ArrowLeft') onButton('dpad-left');
    if (x > 0.9 && e.key === 'ArrowRight') onButton('dpad-right');
  });
  window.__open = (t) => { x = t; v = 0; target = t; settled = true; dirty = true; };
  window.__scanDemo = () => { lensEl.classList.add('found'); found = true; };
}
boot();
</script>
